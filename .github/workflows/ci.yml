name: Verificación de pull requests

# Comprueba las pull requests en **dos jobs en paralelo**:
#
# - `verificar`: `npm ci`, `npm run lint` y `npm run build`. Dice si el código
#   compila y pasa el linter.
# - `test`: `npm ci` y `npm test` (Vitest). Dice si la lógica que no se ve —el
#   motor de puntos, el de alertas, la frontera con la API— sigue cumplir las
#   reglas de `docs/PUNTUACION.md`.
#
# Van separados a propósito. Compilar es lento y los tests no lo necesitan, así que
# un fallo de lógica no tiene que esperar al `next build` para salir, y el
# veredicto de los tests no se pierde porque el build haya fallado antes (ni al
# revés). Cada uno con su `npm ci`: compartir el directorio de trabajo entre dos
# jobs en paralelo no es posible, y un `node_modules` compartido sería una carrera.
#
# No se dispara en los pushes a `main` porque ese despliegue ya lo hace el
# trigger de Workers Builds, que es además el único sitio donde se construye de
# verdad el bundle de OpenNext y el Worker. Aquí no hay nada que desplegar, solo
# que comprobar que el código compila, pasa el linter y pasa los tests.
#
# Convive con los previews de Workers Builds, que también se disparan en un push
# a una rama y también despliegan, pero no lo sustituyen: un Preview tarda bastante
# más que `npm ci && npm test`, así que este workflow es el que da el veredicto
# en un par de minutos. Ver docs/DESPLIEGUE.md, "Workers Builds: `main` despliega y
# las ramas hacen Preview".

on:
  pull_request:
    types: [opened, synchronize, reopened]

# El repositorio es público y este workflow solo lee el código del pull request:
# no necesita ningún otro permiso. Lo hereda también el job de tests.
permissions:
  contents: read

# Un push nuevo en la misma pull request cancela la ejecución anterior: sus minutos
# ya no sirven para el commit que se está comprobando.
#
# El grupo va a nivel de workflow y **no** por job a propósito. Con un grupo por job
# los dos compartían nombre en la práctica, así que al arrancar el segundo cancelaba
# al primero: el job `test` llegaba a morirse en el mismo instante en que se creaba,
# sin log y sin decir por qué. Cancelar la ejecución entera es además lo que se
# quiere, porque los dos jobs comprueban el mismo commit: si ese commit ya no es el
# último, ninguno de los dos minutos sirve.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # La 22 es la versión con la que se desarrolla y con la que se ha
      # comprobado que este workflow pasa; el README pide 20 o superior.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `npm ci` corre el `postinstall` del `package.json`, que es el
      # `prisma generate` que deja el cliente en `src/generated/prisma`. Sin él
      # el `next build` no encuentra el cliente que importan las páginas.
      - run: npm ci

      - run: npm run lint

      # Ni `.env` ni `.env.local` existen aquí, y `prisma7.config.ts` (que es lo
      # que lee `DATABASE_URL` para el `prisma generate` del `postinstall`) los
      # busca precisamente para poder prescindir de ellos: que no haya ninguno es
      # el caso normal, no un fallo del cargador. Ver scripts/load-env.mjs.
      #
      # No se definen variables de entorno, ni `NEXT_PUBLIC_*` ni `DATABASE_URL`:
      # `next build` pasa sin ninguna. Las páginas que leen de Postgres son
      # dinámicas y se renderizan en la petición, y el cliente de Prisma se crea
      # de forma perezosa, así que el build no abre ninguna conexión. Las
      # `NEXT_PUBLIC_*` solo se necesitan para el *bundle* que se despliega, que
      # en una pull request no hay: sin ellas `NEXT_PUBLIC_SITE_URL` cae a
      # `http://localhost:3000` y los metadatos que se compilan aquí se
      # descartan al terminar el job.
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    # Margen de sobra para lo que hace: instalar y pasar unos segundos de tests. El
    # tope está para que un test colgado (una llamada a la red que no se acaba) no
    # se lleve los minutos de un runner entero.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # El `prisma generate` del `postinstall` también hace falta aquí: los tests
      # de `scoring.test.ts` y de `normalize.test.ts` importan los enums y el
      # cliente de `src/generated/prisma`, que no está versionado.
      - run: npm ci

      # Ni variables de entorno ni `DATABASE_URL`: los tests cubren lógica pura de
      # `src/lib` y no abren ni una conexión ni una llamada a la API de AoE4World.
      # `CI` no se define a mano porque Actions ya lo pone a `true` en todos los
      # pasos, y `npm test` es `vitest run` —sin modo watch— tanto en local como
      # aquí, que es lo que hace que el resultado sea el mismo en los dos sitios.
      - run: npm test

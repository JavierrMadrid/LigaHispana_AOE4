name: Sincronización AoE4World

# Disparo manual del sync del worker (ver README, "Cadencia recomendada").
#
# La cadencia de verdad la lleva el **Cron Trigger nativo** de Cloudflare
# (`triggers.crons` en `wrangler.jsonc`), no esto. Antes era un `schedule` de
# GitHub, y se quito porque GitHub no lo cumple: documenta que los workflows
# programados se retrasan, y con `*/5` el intervalo real era de varias horas.
# Dejarlo puesto ademas de el de Cloudflare haria dos syncs a la vez de vez en
# cuando, que es lo que este workflow evita con su `concurrency`.
#
# Queda como boton de emergencia para lanzar una pasada sin esperar al cron.
# Llama a `GET/POST /api/cron/sync` con `Authorization: Bearer`.
# Necesita, en el repositorio:
#   - variable `SITE_URL` (Settings > Secrets and variables > Actions > Variables)
#   - secreto `CRON_SECRET` (mismo sitio, pestaña Secrets)

on:
  workflow_dispatch:

# Si una pasada tarda más que el intervalo, la siguiente espera en vez de solaparse.
concurrency:
  group: cron-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Comprobar que SITE_URL y CRON_SECRET están definidos
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta la variable SITE_URL o el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

      - name: Llamar al worker
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sync"

name: Sincronización AoE4World

# Cron externo del worker (ver README, "Cadencia recomendada").
# Llama a `GET/POST /api/cron/sync` cada 5 minutos con `Authorization: Bearer`.
# Necesita, en el repositorio:
#   - variable `SITE_URL` (Settings > Secrets and variables > Actions > Variables)
#   - secreto `CRON_SECRET` (mismo sitio, pestaña Secrets)
# `workflow_dispatch` permite lanzarlo a mano desde la pestaña Actions.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Si una pasada tarda más que el intervalo, la siguiente espera en vez de solaparse.
concurrency:
  group: cron-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Comprobar que SITE_URL y CRON_SECRET están definidos
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta la variable SITE_URL o el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

      - name: Llamar al worker
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sync"
